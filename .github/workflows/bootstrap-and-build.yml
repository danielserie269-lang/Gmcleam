name: Bootstrap Flutter + Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project if missing
        shell: bash
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            flutter create --platforms=android --org com.gmclean.app .
          fi

      - name: Write polished home (starter)
        shell: bash
        run: |
          cat > lib/main.dart <<'EOF'
          import "package:flutter/material.dart";

          void main() => runApp(const GmcleanApp());

          class GmcleanApp extends StatelessWidget {
            const GmcleanApp({super.key});

            @override
            Widget build(BuildContext context) {
              const seed = Color(0xFF1E88E5);
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: "Gmclean",
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(seedColor: seed, brightness: Brightness.light),
                  scaffoldBackgroundColor: const Color(0xFFF6F8FB),
                ),
                darkTheme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(seedColor: seed, brightness: Brightness.dark),
                ),
                home: const Home(),
              );
            }
          }

          class Home extends StatelessWidget {
            const Home({super.key});

            @override
            Widget build(BuildContext context) {
              final cs = Theme.of(context).colorScheme;
              return Scaffold(
                appBar: AppBar(title: const Text("Gmclean"), centerTitle: true),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      Container(
                        padding: const EdgeInsets.all(16),
                        decoration: BoxDecoration(
                          color: cs.primaryContainer,
                          borderRadius: BorderRadius.circular(18),
                        ),
                        child: Row(
                          children: [
                            Icon(Icons.auto_delete_outlined, color: cs.onPrimaryContainer),
                            const SizedBox(width: 12),
                            Expanded(
                              child: Text(
                                "Limpeza rápida da caixa de entrada",
                                style: TextStyle(
                                  color: cs.onPrimaryContainer,
                                  fontSize: 16,
                                  fontWeight: FontWeight.w800,
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                      const SizedBox(height: 12),
                      const _Card(icon: Icons.local_offer_outlined, title: "Promoções", sub: "Arquivar em massa"),
                      const SizedBox(height: 10),
                      const _Card(icon: Icons.newspaper_outlined, title: "Newsletters", sub: "Cancelar inscrições"),
                      const SizedBox(height: 10),
                      const _Card(icon: Icons.query_stats_outlined, title: "Resumo", sub: "Stats e top remetentes"),
                      const Spacer(),
                      FilledButton.icon(
                        onPressed: null,
                        icon: const Icon(Icons.link),
                        label: const Text("Conectar Gmail (em seguida)"),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class _Card extends StatelessWidget {
            final IconData icon;
            final String title;
            final String sub;
            const _Card({required this.icon, required this.title, required this.sub});

            @override
            Widget build(BuildContext context) {
              final cs = Theme.of(context).colorScheme;
              return Container(
                padding: const EdgeInsets.all(16),
                decoration: BoxDecoration(
                  color: cs.surfaceContainerHighest,
                  borderRadius: BorderRadius.circular(18),
                  border: Border.all(color: cs.outlineVariant),
                ),
                child: Row(
                  children: [
                    Icon(icon),
                    const SizedBox(width: 12),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(title, style: const TextStyle(fontSize: 16, fontWeight: FontWeight.w900)),
                          const SizedBox(height: 4),
                          Text(sub, style: TextStyle(color: cs.onSurfaceVariant)),
                        ],
                      ),
                    )
                  ],
                ),
              );
            }
          }
          EOF

      - name: Build APK (debug)
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmclean-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Commit generated project back to repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Bootstrap Flutter app + build pipeline"
          git push
